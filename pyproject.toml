[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-enrichment"
version = "0.1.0"
description = "Document enrichment package using LangChain"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
